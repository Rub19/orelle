# Typecheck, unit tests and a full build on Windows for every push and pull request.
# The smoke test needs an interactive desktop session (taskbar, DWM, Core Audio) and runs locally
# with `npm run smoke`; see docs/ROADMAP.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs
