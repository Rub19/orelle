<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' orelle-icon: data:; font-src 'self'" />
    <title>Orelle</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="titlebar"><span class="titlebar-title" id="winTitle">Orelle</span></div>
    <div class="app">
      <nav class="sidebar">
        <div class="brand">
          <img src="../icons/orelle-64.png" alt="" />
          <div>
            <div class="brand-name">Orelle</div>
            <div class="brand-sub" id="brandSub"></div>
          </div>
        </div>
        <label class="search">
          <span id="searchIcon"></span>
          <input id="search" type="search" autocomplete="off" spellcheck="false" />
          <kbd class="search-key">Ctrl K</kbd>
        </label>
        <ul class="nav" id="nav"></ul>
      </nav>
      <main class="content" id="content"></main>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
